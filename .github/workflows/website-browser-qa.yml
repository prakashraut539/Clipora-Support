name: Website browser QA
on:
  push:
    branches: [codex/website-browser-qa-2026-10-29]
    paths: ['.github/workflows/website-browser-qa.yml', 'website-qa/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari:
    if: ${{ !contains(github.event.head_commit.message, '[edge-only]') }}
    name: Actual Safari on macOS
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: website-qa
    env:
      QA_BROWSER: safari
      QA_BASE_URL: http://127.0.0.1:8766
      QA_OUTPUT: qa-results/safari
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated Safari automation
        run: |
          sw_vers
          safaridriver --version
          sudo safaridriver --enable
      - name: Serve checked static build
        run: node serve.cjs > preview.log 2>&1 &
      - run: npm run test:webdriver
      - run: node qa-growth-webdriver.cjs
        env:
          QA_OUTPUT: qa-results/safari-growth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-evidence
          path: website-qa/qa-results
          retention-days: 1
  edge:
    if: ${{ !contains(github.event.head_commit.message, '[safari-only]') }}
    name: Actual Microsoft Edge on Windows
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: website-qa
    env:
      QA_ENGINES: msedge
      QA_BASE_URL: http://127.0.0.1:8766
      QA_OUTPUT: qa-results/edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Update isolated runner to current stable Microsoft Edge
        run: npx playwright install msedge
      - name: Serve checked static build
        run: Start-Process node -ArgumentList 'serve.cjs' -WindowStyle Hidden
      - run: npm run test:playwright
      - run: node qa-growth.cjs
        env:
          QA_OUTPUT: qa-results/edge-growth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-evidence
          path: website-qa/qa-results
          retention-days: 1
